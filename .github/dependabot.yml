version: 2
updates:
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /tests/typing
    schedule:
      interval: monthly

  - package-ecosystem: uv
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    groups:
      uv-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    open-pull-requests-limit: 0
    directory: /rust
    schedule:
      interval: monthly
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
