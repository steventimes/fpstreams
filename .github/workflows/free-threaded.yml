name: Free-threaded experimental

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Build native extension
        run: |
          uv sync --group build --group test
          uv run maturin develop --release
      - name: Static audit
        run: uv run python tools/audit_free_threaded.py
      - name: Smoke
        run: uv run python tools/free_threaded_smoke.py --threads 16 --iterations 20 --json free-threaded.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: free-threaded-smoke
          path: free-threaded.json
