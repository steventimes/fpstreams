name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to build, with or without a leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/ci.yml
    with:
      qualification: true

  validate:
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Verify release version markers
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
          EXPECTED_RELEASE_VERSION: "2.5.0"
        run: |
          test "${RELEASE_TAG#v}" = "$EXPECTED_RELEASE_VERSION"
          python scripts/check_release_version.py --expected "$EXPECTED_RELEASE_VERSION"
      - name: Verify the qualified release lockfile
        run: uv lock --check

  linux:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
          manylinux: auto
      - name: Smoke-test wheel in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.release-smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_release.py" --require-installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}-${{ github.sha }}
          retention-days: 7
          path: dist

  musllinux:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
          manylinux: musllinux_1_2
      - name: Smoke-test wheel on musl
        run: >-
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /tmp
          python:3.12-alpine sh -c
          'python -m pip install /workspace/dist/*.whl &&
          python -I /workspace/scripts/smoke_release.py --require-installed'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.target }}-${{ github.sha }}
          retention-days: 7
          path: dist

  windows:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: windows-11-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
      - name: Smoke-test wheel in a clean environment
        shell: pwsh
        run: |
          python -m venv .release-smoke
          .release-smoke\Scripts\python.exe -m pip install (Get-ChildItem dist\*.whl)
          Push-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\.release-smoke\Scripts\python.exe" -I "$env:GITHUB_WORKSPACE\scripts\smoke_release.py" --require-installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.target }}-${{ github.sha }}
          retention-days: 7
          path: dist

  macos:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
      - name: Smoke-test wheel in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.release-smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_release.py" --require-installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.target }}-${{ github.sha }}
          retention-days: 7
          path: dist

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
      - name: Build and smoke-test sdist in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.release-smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_release.py" --require-installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist-${{ github.sha }}
          retention-days: 7
          path: dist

  manifest:
    needs: [linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*-${{ github.sha }}
          path: dist/packages
          merge-multiple: true
      - name: Write SHA-256 manifest
        working-directory: dist/packages
        run: sha256sum * > ../SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts-${{ github.sha }}
          retention-days: 14
          path: dist

  publish:
    if: github.event_name == 'release'
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/fpstreams
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/packages

  release-assets:
    if: github.event_name == 'release'
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts-${{ github.sha }}
          path: dist
      - name: Attach packages and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/SHA256SUMS dist/packages/*
          --clobber --repo "$GITHUB_REPOSITORY"
