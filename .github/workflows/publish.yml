name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to build, with or without a leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              package_version = tomllib.load(pyproject)["project"]["version"]

          release_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if release_version != package_version:
              raise SystemExit(
                  f"Release tag {release_version!r} does not match package version "
                  f"{package_version!r}."
              )
          PY

  linux:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
          manylinux: auto
      - name: Smoke-test wheel in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.release-smoke/bin/python" "$GITHUB_WORKSPACE/tools/smoke_release.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
          manylinux: musllinux_1_2
      - name: Smoke-test wheel on musl
        run: >-
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /tmp
          python:3.12-alpine sh -c
          'python -m pip install /workspace/dist/*.whl &&
          python /workspace/tools/smoke_release.py'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: windows-11-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
      - name: Smoke-test wheel in a clean environment
        shell: pwsh
        run: |
          python -m venv .release-smoke
          .release-smoke\Scripts\python.exe -m pip install (Get-ChildItem dist\*.whl)
          Push-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\.release-smoke\Scripts\python.exe" "$env:GITHUB_WORKSPACE\tools\smoke_release.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
      - name: Smoke-test wheel in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.release-smoke/bin/python" "$GITHUB_WORKSPACE/tools/smoke_release.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path rust/Cargo.toml
          maturin-version: v1.14.1
      - name: Build and smoke-test sdist in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.release-smoke/bin/python" "$GITHUB_WORKSPACE/tools/smoke_release.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  manifest:
    needs: [linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist/packages
          merge-multiple: true
      - name: Write SHA-256 manifest
        run: python tools/write_sha256_manifest.py dist/packages dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist

  publish:
    if: github.event_name == 'release'
    needs: manifest
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fpstreams
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages
