name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Select the CI suite to run
        required: true
        default: tests
        type: choice
        options:
          - tests
          - benchmark
          - free-threaded
          - all

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'tests' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Install and build
        run: |
          uv sync --group build --group test
          uv run maturin develop --release
      - name: Test
        run: uv run pytest -q

  minimal:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'tests' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Verify the base install without optional dependencies
        run: >-
          uv run --isolated --frozen --no-default-groups
          python tools/smoke_release.py --minimal

  platform-smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'tests' || inputs.suite == 'all'))
    name: ${{ matrix.os }} smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Build and run path, spill, and async smoke contracts
        run: |
          uv sync --frozen --group build --group test
          uv run maturin develop --release
          uv run pytest -q -W error tests/test_release.py tests/test_tabular.py -k 'spill or sqlite or high_water'

  quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'tests' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Install all adapters and quality tools
        run: |
          uv sync --frozen --group build --group test --group lint --group type --extra arrow --extra data --extra polars
          uv run maturin develop --release
      - name: Exercise adapter and table contracts with warnings as errors
        run: uv run pytest -q -W error tests/test_release.py tests/test_tabular.py -k 'optional_backend or adapter or table'
      - name: Branch coverage
        run: |
          uv run pytest --cov=src/fpstreams --cov-branch --cov-report=term-missing --cov-report=json
          uv run python tools/check_coverage.py coverage.json
      - name: Python quality
        run: |
          uv run ruff check src tests tools benchmark.py
          uv run ruff format --check src tests tools benchmark.py
          uv run mypy src/fpstreams
          uv lock --check
      - name: Rust quality
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo test --manifest-path rust/Cargo.toml
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

  benchmark-quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Build release native extension
        run: |
          uv sync --frozen --group build --group test
          uv run maturin develop --release
      - name: Run quick benchmark without wall-clock failure
        run: >-
          uv run python benchmark.py --size 10000 --repeats 3 --domain int --quick
          --json benchmark-quick.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-quick
          path: benchmark-quick.json
          if-no-files-found: warn

  benchmark-full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'benchmark' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Build release native extension
        run: |
          uv sync --frozen --group build --group test
          uv run maturin develop --release
      - name: Measure three-run same-host reference
        run: |
          uv run python benchmark.py --size 300000 --repeats 7 --domain both --json run-1.json
          uv run python benchmark.py --size 300000 --repeats 7 --domain both --json run-2.json
          uv run python benchmark.py --size 300000 --repeats 7 --domain both --json run-3.json
          uv run python tools/compare_benchmarks.py --create-baseline \
            --provenance local_one_shot_unreviewed --output scheduled-local-baseline.json \
            run-1.json run-2.json run-3.json
      - name: Enforce same-run timing and resource consistency
        run: |
          uv run python benchmark.py --size 300000 --repeats 7 --domain both \
            --fail-on-regression --json benchmark-full.json
          # A reviewed file enables cross-commit comparison. Until one exists,
          # this fallback only checks a fourth run against this job's local median.
          if [ -f benchmarks/baselines/engine-v2.json ]; then
            uv run python tools/compare_benchmarks.py benchmarks/baselines/engine-v2.json benchmark-full.json
          else
            uv run python tools/compare_benchmarks.py scheduled-local-baseline.json benchmark-full.json
          fi
      - name: Record NumPy and Pandas comparisons
        run: >-
          uv run python benchmark.py --competitive --size 300000 --repeats 7
          --json benchmark-competitive.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-full
          path: |
            benchmark-full.json
            benchmark-competitive.json
            scheduled-local-baseline.json
          if-no-files-found: warn

  free-threaded:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'free-threaded' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Build native extension
        run: |
          uv sync --group build --group test
          uv run maturin develop --release
      - name: Static audit
        run: uv run python tools/audit_free_threaded.py
      - name: Guarded NamedTuple adapter stays GIL-only
        run: |
          uv run python - <<'PY'
          from fpstreams import _native

          factory = _native.standard_namedtuple_record_adapter_v1
          assert factory(*(None,) * 11) is None
          PY
      - name: Native record join snapshot stress
        env:
          FPSTREAMS_FT_JOIN_ITERATIONS: "500000"
        run: >-
          uv run pytest -q
          tests/test_engine.py::test_exact_record_join_snapshot_never_runs_colliding_key_protocol_during_mutation
          tests/test_engine.py::test_exact_record_join_compact_right_snapshot_is_coherent_during_mutation
      - name: Native tuple-row group snapshot stress
        env:
          FPSTREAMS_FT_GROUP_ITERATIONS: "500000"
        run: >-
          uv run pytest -q
          tests/test_engine.py::test_exact_list_tuple_row_group_sum_uses_a_coherent_snapshot_during_mutation
      - name: Native exact-dict group lock stress
        env:
          FPSTREAMS_FT_DICT_GROUP_ITERATIONS: "500000"
        run: >-
          uv run pytest -q
          tests/test_engine.py::test_exact_dict_group_sum_locks_shape_before_selector_lookup_during_mutation
      - name: Smoke
        run: uv run python tools/free_threaded_smoke.py --threads 16 --iterations 20 --json free-threaded.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: free-threaded-smoke
          path: free-threaded.json
