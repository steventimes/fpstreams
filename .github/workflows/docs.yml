name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'fpstreams/**'
      - 'src/fpstreams/**'
      - 'scripts/build_browser_wheel.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --frozen --group docs
      - name: Build browser playground wheel
        run: python scripts/build_browser_wheel.py
      - name: Deploy to gh-pages
        run: >-
          uv run mkdocs gh-deploy --strict --message "Update docs 2.5.0"
          --remote-branch gh-pages
          --config-file fpstreams/mkdocs.yml
