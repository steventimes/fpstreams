name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Install and build
        run: |
          uv sync --group build --group test
          uv run maturin develop --release
      - name: Test
        run: uv run pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
      - name: Install tools
        run: uv sync --group build --group test --group lint --group type
      - name: Branch coverage
        run: |
          uv run pytest --cov=src/fpstreams --cov-branch --cov-report=term-missing --cov-report=json
          uv run python tools/check_coverage.py coverage.json
      - name: Python quality
        run: |
          uv run ruff check src tests benchmark.py
          uv run ruff format --check src tests benchmark.py
          uv run mypy src/fpstreams
          uv lock --check
      - name: Rust quality
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo test --manifest-path rust/Cargo.toml
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
