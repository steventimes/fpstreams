[package]
name = "fpstreams-native"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Native fused execution kernels for fpstreams."
license = "MIT"
repository = "https://github.com/steventimes/fpstreams"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.0", features = ["abi3-py311", "extension-module"] }
