[package]
name = "fpstreams-native"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Native fused execution kernels for fpstreams."
license = "MIT"
repository = "https://github.com/steventimes/fpstreams"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

[build-dependencies]
pyo3-build-config = "0.29.2"
