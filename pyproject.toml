[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fpstreams"
version = "2.0.0a1"
description = "Python-native lazy data pipelines with optional Rust acceleration."
readme = "README.md"
authors = [
  { name = "Steven Yang", email = "stevenyang0316@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.11"
keywords = ["functional", "streams", "pipeline", "data-processing", "rust"]

# --- Optional Dependencies ---
# Users can install these with: pip install fpstreams[test] or fpstreams[async]
[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiofiles>=24",
    "pandas>=2",
    "pyarrow>=16",
    "polars>=1.34"
]
async = [
    "aiofiles>=24"
]
arrow = [
    "pyarrow>=16"
]
data = [
    "numpy>=1.26",
    "pandas>=2",
    "pyarrow>=16"
]
polars = [
    "polars>=1.34",
    "pyarrow>=16"
]
all = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "aiofiles>=24",
    "numpy>=1.26",
    "pandas>=2",
    "pyarrow>=16",
    "polars>=1.34"
]

[project.urls]
"Homepage" = "https://github.com/steventimes/fpstreams"
"Bug Tracker" = "https://github.com/steventimes/fpstreams/issues"
"Documentation" = "https://steventimes.github.io/fpstreams/"

[tool.mypy]
strict = true
packages = ["fpstreams"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "fpstreams._native"
features = ["pyo3/abi3-py311", "pyo3/extension-module"]

[dependency-groups]
build = ["maturin>=1.9,<2"]
test = [
    "aiofiles>=24",
    "pandas>=2",
    "pyarrow>=16",
    "polars>=1.34",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
]
lint = ["ruff>=0.12"]
type = ["mypy>=1.17"]
docs = [
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.27,<1",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
