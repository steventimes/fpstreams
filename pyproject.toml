[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fpstreams"
version = "2.1.0"
description = "Typed, lazy Python data pipelines with bounded async concurrency and optional Rust, Arrow, and NumPy acceleration."
readme = "README.md"
authors = [
  { name = "Steven Yang", email = "stevenyang0316@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"
keywords = [
    "apache-arrow",
    "asyncio",
    "data-pipelines",
    "data-processing",
    "functional-programming",
    "lazy-evaluation",
    "numpy",
    "rust",
    "stream-processing",
    "typed-python",
]

# --- Optional Dependencies ---
# Users can install these with: pip install fpstreams[test] or fpstreams[async]
[project.optional-dependencies]
test = [
    "hypothesis>=6.138,<7",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "pytest-asyncio>=0.24",
    "aiofiles>=24",
    "pandas>=2",
    "pyarrow>=16",
    "polars>=1.34"
]
async = [
    "aiofiles>=24"
]
arrow = [
    "pyarrow>=16"
]
data = [
    "numpy>=1.26",
    "pandas>=2",
    "pyarrow>=16"
]
polars = [
    "polars>=1.34",
    "pyarrow>=16"
]
all = [
    "hypothesis>=6.138,<7",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "pytest-asyncio>=0.24",
    "aiofiles>=24",
    "numpy>=1.26",
    "pandas>=2",
    "pyarrow>=16",
    "polars>=1.34"
]

[project.urls]
"Homepage" = "https://github.com/steventimes/fpstreams"
"Bug Tracker" = "https://github.com/steventimes/fpstreams/issues"
"Changelog" = "https://github.com/steventimes/fpstreams/blob/master/CHANGELOG.md"
"Documentation" = "https://steventimes.github.io/fpstreams/"

[tool.mypy]
strict = true
packages = ["fpstreams"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/fpstreams"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true

[tool.coverage.json]
output = "coverage.json"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "fpstreams._native"
features = ["pyo3/abi3-py311", "pyo3/extension-module"]
include = [{ path = "CHANGELOG.md", format = "sdist" }]

[dependency-groups]
build = ["maturin>=1.9,<2"]
test = [
    "aiofiles>=24",
    "hypothesis>=6.138,<7",
    "pandas>=2",
    "pyarrow>=16",
    "polars>=1.34",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "pytest-asyncio>=0.24",
]
lint = ["ruff>=0.12"]
type = ["mypy>=2.3.1"]
docs = [
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.27,<2",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15
